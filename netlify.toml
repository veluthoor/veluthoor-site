[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  # esbuild bundles the shared helpers in netlify/lib and @netlify/blobs.
  node_bundler = "esbuild"

# Clean paths for the newsletter functions. Must come BEFORE the catch-all below.
[[redirects]]
  from = "/api/subscribe"
  to = "/.netlify/functions/subscribe"
  status = 200

[[redirects]]
  from = "/api/confirm"
  to = "/.netlify/functions/confirm"
  status = 200

[[redirects]]
  from = "/api/unsubscribe"
  to = "/.netlify/functions/unsubscribe"
  status = 200

[[redirects]]
  from = "/api/subscribers"
  to = "/.netlify/functions/subscribers"
  status = 200

[[redirects]]
  from = "/*"
  to = "/404"
  status = 404
